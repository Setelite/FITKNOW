name: Build FITKNOW iPhone and Android icons
on:
  push:
    paths:
      - 'icon.svg'
      - '.github/workflows/build-fitknow-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render PNG icons from SVG
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          import io
          source='icon.svg'
          for size,name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              rendered=cairosvg.svg2png(url=source,output_width=size,output_height=size)
              im=Image.open(io.BytesIO(rendered)).convert('RGB')
              im.save(name,optimize=True)
              print(name,im.size)
          PY
      - name: Commit PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Generate FITKNOW branded iOS and PWA PNG icons" && git push)
