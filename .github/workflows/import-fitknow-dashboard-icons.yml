name: Import FITKNOW dashboard 3D icons
on:
  push:
    paths:
      - '.github/workflows/import-fitknow-dashboard-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy shared approved icons
        run: |
          mkdir -p assets/dashboard-icons
          for icon in nutrition training supplements analyses cardio protocol data settings; do
            curl --fail --location --retry 3 --max-time 40 --silent --show-error "https://raw.githubusercontent.com/Setelite/sushka-plan/main/assets/dashboard-icons/${icon}.webp" -o "assets/dashboard-icons/${icon}.webp"
            test "$(wc -c < "assets/dashboard-icons/${icon}.webp")" -gt 2000
          done
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard-icons
          git diff --cached --quiet || (git commit -m "Add matching FITKNOW dashboard 3D icons" && git push)
